<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKBOX Operations</title><style>body{font:16px system-ui;margin:2rem;background:#10151d;color:#e9eef5}main{max-width:900px;margin:auto}section{border:1px solid #394555;border-radius:10px;padding:1rem;margin:1rem 0;background:#171f2a}button{padding:.6rem 1rem;background:#2864d7;color:white;border:0;border-radius:6px}code{color:#9bd1ff}</style></head>
<body><main><h1>BLACKBOX Operations</h1><p>Authenticated incident evidence view. Data is loaded from the configured API; no activity is fabricated.</p><section><label>Bearer token <input id="token" type="password" size="45"></label><br><label>Incident ID <input id="incident" value="BBX-001"></label> <button id="load">Load incident</button></section><section id="result"><p>Awaiting an authenticated request.</p></section></main><script>document.getElementById('load').onclick=async()=>{const id=document.getElementById('incident').value.trim();const token=document.getElementById('token').value.trim();const out=document.getElementById('result');if(!id||!token){out.textContent='Incident ID and token are required.';return}const r=await fetch('/incidents/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token}});const data=await r.json();out.innerHTML='<pre>'+document.createTextNode(JSON.stringify(data,null,2)).textContent+'</pre>'}</script></body>
</html>
