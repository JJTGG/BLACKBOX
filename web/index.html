<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKBOX Operations</title><style>body{font:16px system-ui;margin:2rem;background:#10151d;color:#e9eef5}main{max-width:900px;margin:auto}section{border:1px solid #394555;border-radius:10px;padding:1rem;margin:1rem 0;background:#171f2a}button{padding:.6rem 1rem;background:#2864d7;color:white;border:0;border-radius:6px}</style></head>
<body><main><h1>BLACKBOX Operations</h1><p>Authenticated incident view. Data is rendered as text and loaded from the API.</p><section><label>Bearer token <input id="token" type="password" size="45"></label><br><label>Incident ID <input id="incident" value="BBX-001"></label> <button id="load">Load incident</button></section><section id="result" aria-live="polite">Awaiting an authenticated request.</section></main><script>
const result=document.getElementById('result');
document.getElementById('load').addEventListener('click',async()=>{result.textContent='Loading…';const id=document.getElementById('incident').value.trim();const token=document.getElementById('token').value.trim();if(!id||!token){result.textContent='Incident ID and token are required.';return}try{const response=await fetch('/incidents/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token}});const data=await response.json();result.textContent=JSON.stringify(data,null,2);if(!response.ok)result.setAttribute('data-error','true')}catch(error){result.textContent='Request failed.'}});
</script></body></html>
